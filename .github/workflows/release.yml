name: Release builds

# Builds the Windows D3D12 and Vulkan executables and the Linux AppImage and
# attaches them to the GitHub release for the pushed tag. The Arch/CachyOS
# package is built natively with packaging/arch/PKGBUILD and uploaded
# separately.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (D3D12 + Vulkan)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Vulkan SDK
        # Silent install with the official LunarG installer (Qt IFW CLI). The
        # third-party "install-vulkan-sdk" action 7z-extracts the installer,
        # which no longer yields an SDK layout with current installers.
        # Falls back to building the loader with the runner's vcpkg: the only
        # things build_vulkan.bat needs are Include\vulkan\*.h and Lib\vulkan-1.lib.
        shell: pwsh
        run: |
          $sdk = $null
          try {
            $url = 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe'
            Invoke-WebRequest -Uri $url -OutFile vulkan_sdk.exe -UseBasicParsing
            Write-Host "installer size: $((Get-Item vulkan_sdk.exe).Length) bytes"
            $p = Start-Process -FilePath "$PWD\vulkan_sdk.exe" -Wait -PassThru `
                 -RedirectStandardOutput sdk-out.txt -RedirectStandardError sdk-err.txt `
                 -ArgumentList '--root','C:\VulkanSDK\latest','--accept-licenses','--default-answer','--confirm-command','--verbose','install'
            Get-Content sdk-out.txt, sdk-err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
            if ($p.ExitCode -eq 0 -and (Test-Path 'C:\VulkanSDK\latest\Lib\vulkan-1.lib')) {
              $sdk = 'C:\VulkanSDK\latest'
            } else {
              Write-Host "LunarG installer failed (exit $($p.ExitCode)) - falling back to vcpkg"
            }
          } catch {
            Write-Host "LunarG installer error: $_ - falling back to vcpkg"
          }
          if (-not $sdk) {
            $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
            & "$vcpkg\vcpkg.exe" install vulkan-loader --triplet x64-windows
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg install vulkan-loader failed' }
            $sdk = "$PWD\vksdk"
            New-Item -ItemType Directory -Force "$sdk\Include", "$sdk\Lib" | Out-Null
            Copy-Item -Recurse -Force "$vcpkg\installed\x64-windows\include\*" "$sdk\Include\"
            Copy-Item -Force "$vcpkg\installed\x64-windows\lib\vulkan-1.lib" "$sdk\Lib\"
          }
          if (-not (Test-Path "$sdk\Include\vulkan\vulkan.h")) { throw 'vulkan.h missing' }
          if (-not (Test-Path "$sdk\Lib\vulkan-1.lib")) { throw 'vulkan-1.lib missing' }
          Write-Host "VULKAN_SDK=$sdk"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item vulkan_sdk.exe -ErrorAction SilentlyContinue

      - name: Build D3D12 GUI
        shell: cmd
        run: build_gui.bat < nul

      - name: Build Vulkan GUI
        shell: cmd
        working-directory: Vulkan
        run: build_vulkan.bat < nul

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item GPU-PCIe-Test_GUI.exe dist/
          Copy-Item Vulkan/GPU-PCIe-Test-Vulkan.exe dist/
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exes
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*.exe

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    # Build inside an older userland so the AppImage's glibc floor stays low.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates curl file unzip pkg-config \
            libvulkan-dev libgl-dev libfuse2 desktop-file-utils \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      # Ubuntu 22.04's libglfw3 (3.3.6) is built X11-only. Under a Wayland
      # desktop that makes the window an XWayland client, and on an eGPU host
      # every presented frame then goes through the compositor's cross-GPU
      # buffer sharing (NVRM Xid 32 a few seconds after launch). Build GLFW 3.4
      # with both backends; it picks Wayland at runtime when WAYLAND_DISPLAY is
      # set and X11 otherwise. The Wayland client libs are dlopen'ed by GLFW
      # from the host, so nothing Wayland-specific is bundled besides GLFW.
      - name: Build GLFW 3.4 (Wayland + X11)
        run: |
          curl -fsSL --retry 3 -o glfw-3.4.zip https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip
          echo "b5ec004b2712fd08e8861dc271428f048775200a2df719ccf575143ba749a3e9  glfw-3.4.zip" | sha256sum -c -
          unzip -q glfw-3.4.zip
          cmake -S glfw-3.4 -B glfw-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGLFW_BUILD_WAYLAND=ON -DGLFW_BUILD_X11=ON \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build glfw-build --parallel "$(nproc)"
          cmake --install glfw-build
          ldconfig
          # Both backends must be present in the shared library we are about to bundle.
          strings /usr/local/lib/libglfw.so.3 | grep -q wl_display_connect || { echo "GLFW has no Wayland backend"; exit 1; }
          strings /usr/local/lib/libglfw.so.3 | grep -q XOpenDisplay      || { echo "GLFW has no X11 backend"; exit 1; }

      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -S Linux -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel "$(nproc)"

      - name: Stage AppDir
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          ls -R AppDir | head -50

      - name: Build AppImage
        run: |
          curl -fsSL --retry 3 -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="dev"
          # The Vulkan loader must come from the host so it finds the host's ICDs.
          OUTPUT="GPU-PCIe-Test-${VERSION}-x86_64.AppImage" \
          ./linuxdeploy --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/gpu-pcie-test.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/gpu-pcie-test.png \
            --exclude-library 'libvulkan.so*' \
            --output appimage
          ls -la *.AppImage
          echo "APPIMAGE=$(ls *.AppImage)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ${{ env.APPIMAGE }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: ${{ env.APPIMAGE }}
